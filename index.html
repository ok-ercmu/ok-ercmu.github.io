<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ER Shift Check</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#F5F7F7;
    --surface:#FFFFFF;
    --surface-2:#EEF2F2;
    --ink:#1B2A2E;
    --ink-muted:#5C6B6E;
    --line:#DCE3E3;
    --teal:#0F6E63;
    --teal-dark:#0A4E46;
    --navy:#1E3A5F;
    --ok:#157A44;
    --ok-bg:#E7F5EC;
    --warn:#B45309;
    --warn-bg:#FDF1E1;
    --danger:#B0281E;
    --danger-bg:#FBE9E7;
    --idle:#9AA5A5;
    --idle-bg:#EEF1F1;
    --radius:12px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    font-family:'Sarabun',sans-serif;
    background:var(--bg);
    color:var(--ink);
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
  }
  .mono{font-family:'IBM Plex Mono',monospace;}
  button{font-family:inherit;}
  a{color:inherit;}

  /* ---------- App shell ---------- */
  .appbar{
    position:sticky; top:0; z-index:20;
    background:var(--teal-dark);
    color:#fff;
    padding:14px 16px;
    box-shadow:0 2px 8px rgba(10,40,36,0.18);
  }
  .appbar-inner{
    max-width:900px; margin:0 auto;
    display:flex; align-items:center; gap:10px; flex-wrap:wrap;
  }
  .appbar-title{
    display:flex; align-items:center; gap:10px; margin-right:auto;
  }
  .appbar-tag{
    width:34px;height:34px;border-radius:8px;
    background:linear-gradient(155deg,#2AA98C,#0F6E63);
    display:flex;align-items:center;justify-content:center;
    font-family:'IBM Plex Mono',monospace; font-weight:600; font-size:13px;
    color:#EAFBF4; flex:none;
    box-shadow:inset 0 0 0 1px rgba(255,255,255,0.15);
  }
  .appbar-title h1{font-size:16px; margin:0; font-weight:700; line-height:1.2;}
  .appbar-title span{display:block; font-size:11.5px; color:#BFE3D9; font-weight:500;}

  .ctrl{
    display:flex; align-items:center; gap:6px;
    background:rgba(255,255,255,0.08);
    border:1px solid rgba(255,255,255,0.18);
    border-radius:9px; padding:4px 8px;
  }
  .ctrl label{font-size:11px; color:#BFE3D9; font-weight:600; white-space:nowrap;}
  .ctrl input, .ctrl select{
    border:none; background:transparent; color:#fff; font-family:inherit;
    font-size:13.5px; font-weight:600; padding:4px 2px; outline:none;
  }
  .ctrl select option{color:#111;}
  .ctrl input[type="date"]{color-scheme:dark;}

  .container{max-width:900px; margin:0 auto; padding:16px;}

  /* ---------- Dashboard ---------- */
  .summary-strip{
    display:flex; align-items:center; justify-content:space-between;
    background:var(--surface); border:1px solid var(--line); border-radius:var(--radius);
    padding:12px 16px; margin-bottom:14px;
  }
  .summary-strip .big{
    font-family:'IBM Plex Mono',monospace; font-size:22px; font-weight:600; color:var(--teal-dark);
  }
  .summary-strip .lbl{font-size:12.5px; color:var(--ink-muted); font-weight:600;}
  .dot-legend{display:flex; gap:14px; font-size:12px; color:var(--ink-muted);}
  .dot-legend span{display:inline-flex; align-items:center; gap:5px;}
  .led{width:9px;height:9px;border-radius:50%; display:inline-block; flex:none;}
  .led.ok{background:var(--ok);}
  .led.warn{background:var(--danger);}
  .led.idle{background:var(--idle);}

  .grid{
    display:grid; grid-template-columns:repeat(2,1fr); gap:10px;
  }
  @media (min-width:620px){ .grid{grid-template-columns:repeat(3,1fr);} }

  .tile{
    background:var(--surface); border:1px solid var(--line); border-radius:var(--radius);
    padding:14px 12px; text-align:left; cursor:pointer;
    position:relative; overflow:hidden;
    transition:transform .12s ease, box-shadow .12s ease;
    display:flex; flex-direction:column; gap:8px; min-height:96px;
  }
  .tile:hover{box-shadow:0 4px 14px rgba(15,110,99,0.14); transform:translateY(-1px);}
  .tile:focus-visible{outline:3px solid var(--teal); outline-offset:2px;}
  .tile-top{display:flex; align-items:flex-start; justify-content:space-between; gap:6px;}
  .tile-id{font-family:'IBM Plex Mono',monospace; font-size:11px; color:var(--ink-muted); font-weight:600; letter-spacing:.02em;}
  .tile-name{font-size:14.5px; font-weight:700; line-height:1.25; color:var(--ink);}
  .tile-status{
    font-size:11px; font-weight:600; display:flex; align-items:center; gap:5px;
    padding:3px 8px; border-radius:20px; align-self:flex-start;
  }
  .tile-status.ok{background:var(--ok-bg); color:var(--ok);}
  .tile-status.warn{background:var(--danger-bg); color:var(--danger);}
  .tile-status.idle{background:var(--idle-bg); color:#6B7676;}
  .tile-meta{font-size:11px; color:var(--ink-muted); margin-top:auto;}

  /* ---------- Detail view ---------- */
  .backrow{display:flex; align-items:center; gap:10px; margin-bottom:12px;}
  .backbtn{
    display:flex; align-items:center; gap:6px;
    background:var(--surface); border:1px solid var(--line); border-radius:9px;
    padding:8px 12px; font-size:13.5px; font-weight:600; color:var(--teal-dark); cursor:pointer;
  }
  .backbtn:hover{background:var(--surface-2);}

  .detail-head{
    background:var(--surface); border:1px solid var(--line); border-radius:var(--radius);
    padding:16px; margin-bottom:14px;
  }
  .detail-head h2{margin:0 0 2px 0; font-size:19px;}
  .detail-head .sub{font-size:12.5px; color:var(--ink-muted); font-weight:600;}
  .staffrow{
    display:flex; gap:10px; margin-top:12px; flex-wrap:wrap; align-items:center;
  }
  .staffrow label{font-size:12.5px; font-weight:600; color:var(--ink-muted);}
  .staffrow input[type=text]{
    flex:1; min-width:160px; border:1px solid var(--line); border-radius:8px;
    padding:8px 10px; font-family:inherit; font-size:13.5px; outline:none;
  }
  .staffrow input[type=text]:focus{border-color:var(--teal);}
  .last-saved{
    margin-top:10px; font-size:12px; color:var(--teal-dark); background:var(--ok-bg);
    display:inline-flex; padding:5px 10px; border-radius:20px; font-weight:600;
  }

  .section-head{
    font-size:12.5px; font-weight:700; color:var(--navy); text-transform:none;
    margin:22px 2px 8px; padding-bottom:6px; border-bottom:2px solid var(--line);
    letter-spacing:.01em;
  }
  .section-head:first-child{margin-top:4px;}

  .item-row{
    background:var(--surface); border:1px solid var(--line); border-radius:10px;
    padding:11px 13px; margin-bottom:8px;
    display:flex; align-items:center; gap:12px; flex-wrap:wrap;
  }
  .item-info{flex:1 1 200px; min-width:160px;}
  .item-label{font-size:13.5px; font-weight:600; color:var(--ink);}
  .item-hint{font-size:11.5px; color:var(--ink-muted); margin-top:1px;}
  .item-prev{font-size:11.5px; color:var(--teal-dark); margin-top:3px; font-weight:600;}
  .item-prev b{font-weight:700;}
  .item-control{display:flex; align-items:center; gap:8px; flex:0 0 auto;}

  .num-input{
    width:78px; border:1px solid var(--line); border-radius:8px; padding:8px 10px;
    font-family:'IBM Plex Mono',monospace; font-size:14px; text-align:center; outline:none;
  }
  .num-input:focus{border-color:var(--teal);}
  .txt-input{
    width:200px; border:1px solid var(--line); border-radius:8px; padding:8px 10px;
    font-family:inherit; font-size:13.5px; outline:none;
  }
  .txt-input:focus{border-color:var(--teal);}
  .date-input{
    border:1px solid var(--line); border-radius:8px; padding:7px 8px;
    font-family:inherit; font-size:12.5px; outline:none;
  }

  .seg{display:flex; border:1px solid var(--line); border-radius:9px; overflow:hidden;}
  .seg button{
    border:none; background:var(--surface); padding:8px 13px; font-size:13px; font-weight:600;
    color:var(--ink-muted); cursor:pointer; transition:background .1s;
  }
  .seg button + button{border-left:1px solid var(--line);}
  .seg button.on-true.active{background:var(--ok-bg); color:var(--ok);}
  .seg button.on-false.active{background:var(--danger-bg); color:var(--danger);}
  .seg button:not(.active):hover{background:var(--surface-2);}

  .note-wrap{flex:1 1 100%; margin-top:2px;}
  .note-wrap textarea{
    width:100%; border:1px solid var(--line); border-radius:8px; padding:8px 10px;
    font-family:inherit; font-size:13px; resize:vertical; min-height:38px; outline:none;
  }
  .note-wrap textarea:focus{border-color:var(--teal);}
  .note-wrap .note-tag{font-size:11px; color:var(--warn); font-weight:600; margin-bottom:3px; display:block;}

  .save-bar{
    position:sticky; bottom:0; background:linear-gradient(180deg, rgba(245,247,247,0), var(--bg) 30%);
    padding:18px 0 10px; margin-top:10px;
  }
  .save-btn{
    width:100%; background:var(--teal); color:#fff; border:none; border-radius:11px;
    padding:14px; font-size:15px; font-weight:700; cursor:pointer;
    box-shadow:0 4px 14px rgba(15,110,99,0.3);
    display:flex; align-items:center; justify-content:center; gap:8px;
  }
  .save-btn:hover{background:var(--teal-dark);}
  .save-btn:disabled{background:var(--idle); box-shadow:none; cursor:not-allowed;}

  .toast{
    position:fixed; left:50%; bottom:24px; transform:translateX(-50%);
    background:var(--teal-dark); color:#fff; padding:10px 18px; border-radius:30px;
    font-size:13.5px; font-weight:600; box-shadow:0 6px 20px rgba(0,0,0,0.2);
    z-index:50; opacity:0; pointer-events:none; transition:opacity .2s, transform .2s;
  }
  .toast.show{opacity:1; transform:translateX(-50%) translateY(-4px);}

  .empty-hint{font-size:12px; color:var(--ink-muted); text-align:center; padding:10px 0 2px;}

  @media (prefers-reduced-motion: reduce){
    *{transition:none !important;}
  }

  /* ---------- Settings modal ---------- */
  .modal-backdrop{
    position:fixed; inset:0; background:rgba(15,30,28,0.45);
    display:none; align-items:center; justify-content:center; z-index:60; padding:16px;
  }
  .modal-backdrop.show{display:flex;}
  .modal-card{
    background:var(--surface); border-radius:14px; max-width:420px; width:100%;
    padding:20px; box-shadow:0 12px 40px rgba(0,0,0,0.25);
  }
  .modal-card h3{margin:0 0 8px; font-size:17px; color:var(--teal-dark);}
  .modal-desc{font-size:12.5px; color:var(--ink-muted); line-height:1.5; margin:0 0 14px;}
  .modal-label{font-size:12px; font-weight:600; color:var(--ink-muted); display:block; margin-bottom:5px;}
  .modal-input{
    width:100%; border:1px solid var(--line); border-radius:8px; padding:9px 10px;
    font-family:'IBM Plex Mono',monospace; font-size:12.5px; outline:none; margin-bottom:14px;
  }
  .modal-input:focus{border-color:var(--teal);}
  .modal-actions{display:flex; gap:8px; justify-content:flex-end; flex-wrap:wrap;}
  .modal-btn{border:none; border-radius:8px; padding:9px 14px; font-size:13px; font-weight:600; cursor:pointer;}
  .modal-btn.primary{background:var(--teal); color:#fff;}
  .modal-btn.primary:hover{background:var(--teal-dark);}
  .modal-btn.ghost{background:var(--surface-2); color:var(--ink);}
  .modal-btn.ghost.danger{color:var(--danger);}
  .modal-btn.ghost:hover{background:var(--line);}
  .sync-note{font-size:11px; margin-top:6px; font-weight:600;}
  .sync-note.ok{color:var(--ok);}
  .sync-note.fail{color:var(--danger);}

  /* ---------- Loading indicators ---------- */
  .topbar-loader{
    position:fixed; top:0; left:0; height:3px; width:0%;
    background:linear-gradient(90deg,#2AA98C,#0F6E63);
    z-index:100; transition:width .35s ease, opacity .25s ease; opacity:0;
  }
  .topbar-loader.active{opacity:1; width:75%;}
  .topbar-loader.done{width:100%; opacity:0;}

  .spinner{
    width:14px; height:14px; border:2px solid var(--line); border-top-color:var(--teal);
    border-radius:50%; display:inline-block; animation:er-spin .7s linear infinite; flex:none;
  }
  .spinner.lg{width:30px; height:30px; border-width:3px;}
  .spinner.on-dark{border-color:rgba(255,255,255,0.3); border-top-color:#fff;}
  @keyframes er-spin{ to{ transform:rotate(360deg); } }

  .center-loader{
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    padding:70px 20px; gap:14px; color:var(--ink-muted); font-size:13.5px; font-weight:600;
  }
</style>
</head>
<body>

<div class="topbar-loader" id="topLoader"></div>

<div class="appbar">
  <div class="appbar-inner">
    <div class="appbar-title">
      <div class="appbar-tag">ER</div>
      <div>
        <h1>ตรวจเช็คของประจำเวร</h1>
        <span>ห้องฉุกเฉิน · 10 ตำแหน่งประจำจุด</span>
      </div>
    </div>
    <div class="ctrl">
      <label for="dateInput">วันที่</label>
      <input type="date" id="dateInput">
    </div>
    <div class="ctrl">
      <label for="shiftInput">เวร</label>
      <select id="shiftInput">
        <option value="ดึก">ดึก</option>
        <option value="เช้า">เช้า</option>
        <option value="บ่าย">บ่าย</option>
      </select>
    </div>
    <div class="ctrl" id="sheetStatusCtrl" title="สถานะการเชื่อมต่อ Google Sheet API">
      <span id="sheetStatusDot" class="led idle" style="margin-right:2px;"></span>
      <label style="cursor:default;">API</label>
    </div>
    <button class="ctrl" id="settingsBtn" style="cursor:pointer; font-weight:700;" title="ตั้งค่า Apps Script API URL">⚙ ตั้งค่า</button>
  </div>
</div>

<div class="modal-backdrop" id="settingsModal">
  <div class="modal-card">
    <h3>เชื่อมต่อ Google Sheet</h3>
    <p class="modal-desc">วางลิงก์ Apps Script Web App URL ที่ deploy จาก Google Sheet ของคุณ (ดูวิธีทำในไฟล์ README.md ที่มาด้วยกัน) แอปนี้ใช้ Google Sheet เป็นฐานข้อมูลหลัก — ถ้ายังไม่ตั้งค่า จะยังใช้งานบันทึก/ดูข้อมูลไม่ได้</p>
    <label class="modal-label" for="sheetUrlInput">Apps Script Web App URL</label>
    <input type="text" id="sheetUrlInput" class="modal-input" placeholder="https://script.google.com/macros/s/XXXXXXXX/exec">
    <div class="modal-actions">
      <button class="modal-btn ghost" id="settingsCancel">ยกเลิก</button>
      <button class="modal-btn ghost danger" id="settingsClear">เลิกเชื่อมต่อ</button>
      <button class="modal-btn primary" id="settingsSave">บันทึก</button>
    </div>
  </div>
</div>

<div class="container" id="app"></div>
<div class="toast" id="toast"></div>

<script>
/* ============================================================
   ตั้งค่าลิงก์ Google Apps Script Web App ตรงนี้ที่เดียว (ทำครั้งเดียวก่อน deploy)
   วางลิงก์ที่ได้จากขั้นตอน Deploy ใน apps-script.gs / README.md
   ตัวอย่าง: 'https://script.google.com/macros/s/AKfycb.../exec'
   หลังตั้งค่าตรงนี้แล้ว ทุกเครื่องที่เปิดเว็บนี้จะเชื่อมต่อได้ทันที
   ไม่ต้องกด ⚙ ตั้งค่า เองทีละเครื่อง (ปุ่มนั้นไว้ใช้เผื่อสลับลิงก์ภายหลัง)
   ============================================================ */
const DEFAULT_API_URL = 'https://script.google.com/macros/s/AKfycbwT3KzswFblhoPyzqdGxKj1C7zJqDqfgd2f2MOgkraNjFIusXKxhJZ3kGXj5AIGjAPs/exec';

/* ============ Item builders ============ */
function N(id,label,hint){ return {id,label,type:'number',hint}; }
function YN(id,label,opts){ opts=opts||{}; return {id,label,type:'yesno',
  trueLabel:opts.trueLabel||'มี', falseLabel:opts.falseLabel||'ไม่มี', noteOnFalse:!!opts.noteOnFalse}; }
function YNE(id,label){ return {id,label,type:'yesno_expiry', trueLabel:'มี', falseLabel:'ไม่มี'}; }
function TXT(id,label){ return {id,label,type:'text'}; }
function SEC(label){ return {type:'section', label}; }

/* ============ Position data ============ */
const POSITIONS = [
{id:'p1', name:'Incharge', items:[
  N('i1','อุณหภูมิตู้เย็นยา','2-8 °C'),
  N('i2','Succinylcholine','5'),
  N('i3','Esmeron','3'),
  N('i4','Propofol','5'),
  N('i5','Ketalar','1'),
  N('i6','จำนวนเลือด O low titer','4 ถุง'),
  N('i7','จำนวนเลือด O WB','2 ถุง'),
  N('i8','อุณหภูมิตู้เย็นเลือด','2-8 °C'),
  N('i9','Morphine','10'),
  N('i10','Midazolam','4'),
  N('i11','Pethidine','4'),
  N('i12','Fentanyl','5'),
  N('i13','Etomidate','5'),
  N('i14','ใบ ยส','2'),
  N('i15','จำนวน Emergency box','3'),
  YN('i16','Ipad ให้เลือด'),
  YN('i17','สายชาร์จ Ipad'),
  YN('i18','เครื่องยิงบาร์โค้ด'),
  YN('i19','กุญแจ Royal suite'),
  YN('i20','กุญแจ OPD นอกเวลา'),
  SEC('อุปกรณ์ฝากขาย Stock ER'),
  N('i21','Single Lumen','3'),
  N('i22','Triple Lumen','3'),
  N('i23','Close Suction','3'),
  N('i24','High flow Adult','3'),
  N('i25','High flow Ped Size L','1'),
  N('i26','High flow Ped Size XL','1'),
  N('i27','High flow แบบต่อ TT','1'),
  SEC('Stock บริจาค'),
  N('i28','Single Lumen'),
  N('i29','Double Lumen'),
  N('i30','Triple Lumen'),
]},
{id:'p2', name:'Assist 1', items:[
  N('i1','Laryngoscope','2'),
  N('i2','จำนวน Blade','3'),
  YNE('i3','Magrill forcep (1)'),
  YNE('i4','Set Umbilical cath (1)'),
  N('i5','Nebulizer Set','3'),
  SEC('Facial Mask'),
  N('i6','Neonatal'),
  N('i7','Pediatric'),
  N('i8','Guide wide'),
  SEC('Endotracheal tube'),
  N('i9','No. 2.5','2'), N('i10','No. 3.0','2'), N('i11','No. 3.5','2'),
  N('i12','No. 4.0','2'), N('i13','No. 4.5','2'), N('i14','No. 5.0','2'),
  N('i15','No. 5.5','2'), N('i16','No. 6.0','2'), N('i17','No. 6.5','2'),
  SEC('Ambu'),
  N('i18','Infant 250 ml','2'),
  N('i19','Pediatric 500 ml','2'),
  N('i20','O2 sat probe','5'),
  N('i21','Cuff Ped'),
  N('i22','สายต่อ cuff BP','1'),
]},
{id:'p3', name:'Assist 2', items:[
  SEC('เครื่อง Monitor Dräger — Zone Emergency'),
  YN('i1','เครื่องที่ 1',{trueLabel:'พร้อมใช้',falseLabel:'ไม่พร้อม',noteOnFalse:true}),
  YN('i2','เครื่องที่ 2',{trueLabel:'พร้อมใช้',falseLabel:'ไม่พร้อม',noteOnFalse:true}),
  YN('i3','เครื่องที่ 3',{trueLabel:'พร้อมใช้',falseLabel:'ไม่พร้อม',noteOnFalse:true}),
  YN('i4','เครื่องที่ 4',{trueLabel:'พร้อมใช้',falseLabel:'ไม่พร้อม',noteOnFalse:true}),
  YN('i5','เครื่องที่ 5',{trueLabel:'พร้อมใช้',falseLabel:'ไม่พร้อม',noteOnFalse:true}),
  SEC('Zone Urgency'),
  YN('i6','เครื่องที่ 1',{trueLabel:'พร้อมใช้',falseLabel:'ไม่พร้อม',noteOnFalse:true}),
  YN('i7','เครื่องที่ 2',{trueLabel:'พร้อมใช้',falseLabel:'ไม่พร้อม',noteOnFalse:true}),
  YN('i8','เครื่องที่ 3',{trueLabel:'พร้อมใช้',falseLabel:'ไม่พร้อม',noteOnFalse:true}),
  YN('i9','เครื่องที่ 4',{trueLabel:'พร้อมใช้',falseLabel:'ไม่พร้อม',noteOnFalse:true}),

const SHIFT_ORDER = ['ดึก','เช้า','บ่าย'];

/* ============ State ============ */
const state = {
  view:'dashboard',
  date: todayStr(),
  shift: defaultShift(),
  posId: null,
  staffName: '',
  currentValues: {},     // itemId -> value obj
  currentMeta: {savedBy:'', savedAt:null},
  prevValues: null,      // loaded previous-shift entry for open position
  dashStatus: {},        // posId -> {state:'ok'|'warn'|'idle', by, at}
  apiUrl: '',
};

function todayStr(){
  const d = new Date();
  const tz = new Date(d.getTime() - d.getTimezoneOffset()*60000);
  return tz.toISOString().slice(0,10);
}
function defaultShift(){
  const h = new Date().getHours();
  if(h>=8 && h<16) return 'เช้า';
  if(h>=16 && h<24) return 'บ่าย';
  return 'ดึก';
}
function addDays(dateStr, n){
  const d = new Date(dateStr+'T00:00:00');
  d.setDate(d.getDate()+n);
  return d.toISOString().slice(0,10);
}
function prevShiftOf(dateStr, shift){
  const idx = SHIFT_ORDER.indexOf(shift);
  if(idx>0) return {date:dateStr, shift:SHIFT_ORDER[idx-1]};
  return {date:addDays(dateStr,-1), shift:'บ่าย'};
}
function fmtDateThai(dateStr){
  const d = new Date(dateStr+'T00:00:00');
  return d.toLocaleDateString('th-TH', {day:'numeric', month:'short', year:'numeric'});
}
function entryKey(date, shift, posId){
  return `chk_${date}_${shift}_${posId}`;
}

/* ============ Loading indicator ============ */
let pendingRequests = 0;
function showLoading(){
  pendingRequests++;
  const bar = document.getElementById('topLoader');
  if(!bar) return;
  bar.classList.remove('done');
  bar.classList.add('active');
}
function hideLoading(){
  pendingRequests = Math.max(0, pendingRequests-1);
  if(pendingRequests>0) return; // wait for all in-flight requests to finish
  const bar = document.getElementById('topLoader');
  if(!bar) return;
  bar.classList.remove('active');
  bar.classList.add('done');
  setTimeout(()=>{ bar.classList.remove('done'); }, 350);
}
function renderCenterLoader(msg){
  app.innerHTML = `<div class="center-loader">
    <span class="spinner lg"></span>
    <div>${msg}</div>
  </div>`;
}

/* ============ API helpers (Google Sheet via Apps Script) ============ */
async function apiGet(params){
  if(!state.apiUrl) return null;
  const qs = new URLSearchParams(params).toString();
  showLoading();
  try{
    const res = await fetch(`${state.apiUrl}?${qs}`, {method:'GET'});
    if(!res.ok) return null;
    return await res.json();
  }catch(e){
    console.error('apiGet failed', e);
    return null;
  }finally{
    hideLoading();
  }
}
async function apiPost(payload){
  if(!state.apiUrl) return {ok:false, skipped:true};
  showLoading();
  try{
    const res = await fetch(state.apiUrl, {
      method:'POST',
      headers:{'Content-Type':'text/plain;charset=utf-8'}, // avoids CORS preflight against Apps Script
      body: JSON.stringify(payload)
    });
    let data = null;
    try{ data = await res.json(); }catch(e){}
    return {ok: !!(data && data.status==='ok'), data};
  }catch(e){
    return {ok:false, error:e};
  }finally{
    hideLoading();
  }
}

async function getEntry(date, shift, posId){
  const res = await apiGet({action:'entry', date, shift, posId});
  if(!res || !res.found) return null;
  return {values: res.values, savedBy: res.savedBy, savedAt: res.savedAt};
}
async function getDashboardStatus(date, shift){
  const res = await apiGet({action:'dashboard', date, shift});
  return res || {};
}
async function setEntry(date, shift, posId, positionName, values, meta, rows){
  return apiPost({
    action:'save', date, shift, posId, positionName,
    values, rows, savedBy: meta.savedBy, savedAt: meta.savedAt
  });
}

/* ============ Evaluate item / entry status ============ */
function allItems(pos){ return pos.items.filter(it=>it.type!=='section' && !it.type===false); }
function itemsOnly(pos){ return pos.items.filter(it=>!('label' in it) ? false : it.type!==undefined && it.type!=='section'); }
function flatItems(pos){ return pos.items.filter(it=>it.type && it.type!=='section'); }

function evalEntry(pos, entry){
  const items = flatItems(pos);
  if(!entry || !entry.values) return {answered:0, total:items.length, warn:0};
  let answered=0, warn=0;
  items.forEach(it=>{
    const v = entry.values[it.id];
    if(v===undefined || v===null) return;
    if(it.type==='number' && v.val!==undefined && v.val!=='') answered++;
    else if(it.type==='text' && v.val) answered++;
    else if(it.type==='yesno' && v.val!==undefined && v.val!==null) { answered++; if(v.val===false) warn++; }
    else if(it.type==='yesno_expiry' && v.val!==undefined && v.val!==null) { answered++; if(v.val===false) warn++; }
  });
  return {answered, total:items.length, warn};
}

      <div class="tile-top">
        <span class="tile-id mono">P${idx+1}</span>

  });

  if(!state.apiUrl){
    document.getElementById('dashCount').textContent = '–/10';

  const dash = await getDashboardStatus(state.date, state.shift);
  let doneCount = 0;
  POSITIONS.forEach(p=>{
    const info = dash[p.id];
    const statusEl = document.getElementById(`status-${p.id}`);
    const metaEl = document.getElementById(`meta-${p.id}`);
    if(!statusEl) return;
    if(!info || !info.exists){
      statusEl.className = 'tile-status idle';
      statusEl.innerHTML = `<i class="led idle"></i>ยังไม่เช็ค`;
      metaEl.textContent = '';
    } else {

      if(info.warn>0){
        statusEl.className = 'tile-status warn';
        statusEl.innerHTML = `<i class="led warn"></i>ต้องระวัง ${info.warn}`;
      } else {
        statusEl.className = 'tile-status ok';
        statusEl.innerHTML = `<i class="led ok"></i>เช็คแล้ว`;

      metaEl.textContent = `โดย ${info.savedBy || '-'} · ${info.savedAt ? new Date(info.savedAt).toLocaleTimeString('th-TH',{hour:'2-digit',minute:'2-digit'}) : ''}`;
    }
  });
  document.getElementById('dashCount').textContent = `${doneCount}/10`;
}

async function openPosition(posId){
  if(!state.apiUrl){
    openSettingsModal();
    showToast('กรุณาเชื่อมต่อ Google Sheet ก่อนใช้งาน');
    return;
  }
  const pos = POSITIONS.find(p=>p.id===posId);
  state.posId = posId;
  state.view='detail';

  renderCenterLoader(`กำลังโหลดข้อมูล ${pos.name}…`);

  const prevInfo = prevShiftOf(state.date, state.shift);
  const [entry, prevEntry] = await Promise.all([
    getEntry(state.date, state.shift, posId),
    getEntry(prevInfo.date, prevInfo.shift, posId)
  ]);

  state.currentValues = (entry && entry.values) ? entry.values : {};
  state.currentMeta = {savedBy: entry?entry.savedBy:'', savedAt: entry?entry.savedAt:null};
  state.prevValues = prevEntry ? prevEntry.values : null;

  if(!state.staffName){
    state.staffName = loadLastStaffName();
  }

  renderDetail(pos, prevInfo, prevEntry);
}

function fmtPrevVal(item, v){
  if(v===undefined || v===null) return null;
  if(item.type==='number') return (v.val===''||v.val===undefined) ? null : v.val;
  if(item.type==='text') return v.val || null;
  if(item.type==='yesno'){
    if(v.val===undefined||v.val===null) return null;
    const lbl = v.val ? item.trueLabel : item.falseLabel;
    return v.note ? `${lbl} — ${v.note}` : lbl;
  }
  if(item.type==='yesno_expiry'){
    if(v.val===undefined||v.val===null) return null;
    if(v.val===true) return `มี (Exp. ${v.expiry||'-'})`;
    return 'ไม่มี';
  }
  return null;
}

function renderDetail(pos, prevInfo, prevEntry){
  const posIdx = POSITIONS.findIndex(p=>p.id===pos.id)+1;
  let html = `
    <div class="backrow">
      <button class="backbtn" id="backBtn">← กลับหน้าหลัก</button>

      <div class="staffrow">

    </div>
    <form id="checkForm">
  `;

  pos.items.forEach(it=>{
    if(it.type==='section'){
      html += `<div class="section-head">${it.label}</div>`;
      return;
    }
    const cur = state.currentValues[it.id] || {};
    const prevRaw = state.prevValues ? state.prevValues[it.id] : null;
    const prevStr = state.prevValues ? fmtPrevVal(it, prevRaw) : null;

    html += `<div class="item-row" data-item="${it.id}" data-type="${it.type}">
      <div class="item-info">
        <div class="item-label">${it.label}</div>
        ${it.hint ? `<div class="item-hint">เป้าหมาย: ${it.hint}</div>` : ''}

    if(it.type==='number'){
      html += `<input type="number" inputmode="decimal" class="num-input" data-field="val" value="${cur.val!==undefined?cur.val:''}">`;
    } else if(it.type==='text'){
      html += `<input type="text" class="txt-input" data-field="val" value="${cur.val?escapeHtml(cur.val):''}">`;
    } else if(it.type==='yesno'){
      html += `
        <div class="seg" data-seg>
          <button type="button" class="on-true ${cur.val===true?'active':''}" data-val="true">${it.trueLabel}</button>
          <button type="button" class="on-false ${cur.val===false?'active':''}" data-val="false">${it.falseLabel}</button>
        </div>`;
    } else if(it.type==='yesno_expiry'){
      html += `
        <div class="seg" data-seg>
          <button type="button" class="on-true ${cur.val===true?'active':''}" data-val="true">${it.trueLabel}</button>
          <button type="button" class="on-false ${cur.val===false?'active':''}" data-val="false">${it.falseLabel}</button>
        </div>
        <input type="date" class="date-input" data-field="expiry" style="display:${cur.val===true?'inline-block':'none'}" value="${cur.expiry||''}">`;
    }
    html += `</div>`;

    if(it.type==='yesno' && it.noteOnFalse){
      html += `<div class="note-wrap" data-note style="display:${cur.val===false?'block':'none'}">
        <span class="note-tag">ระบุเพิ่มเติม</span>
        <textarea data-field="note" placeholder="รายละเอียด...">${cur.note?escapeHtml(cur.note):''}</textarea>
      </div>`;
    }
    html += `</div>`;
  });

  html += `
    </form>
    <div class="save-bar">
      <button class="save-btn" id="saveBtn">บันทึกผลตรวจเช็ค</button>
    </div>
  `;

  app.innerHTML = html;
  document.getElementById('backBtn').addEventListener('click', renderDashboard);
  document.getElementById('staffInput').addEventListener('input', e=>{ state.staffName = e.target.value; });

  app.querySelectorAll('.item-row').forEach(row=>{
    const seg = row.querySelector('[data-seg]');
    if(seg){
      seg.querySelectorAll('button').forEach(btn=>{
        btn.addEventListener('click', ()=>{
          seg.querySelectorAll('button').forEach(b=>b.classList.remove('active'));
          btn.classList.add('active');
          const val = btn.dataset.val === 'true';
          const dateInput = row.querySelector('[data-field="expiry"]');
          if(dateInput) dateInput.style.display = val ? 'inline-block' : 'none';
          const noteWrap = row.querySelector('[data-note]');
          if(noteWrap) noteWrap.style.display = (val===false) ? 'block' : 'none';
        });
      });
    }
  });

  document.getElementById('saveBtn').addEventListener('click', async ()=>{
    if(!state.staffName || !state.staffName.trim()){
      document.getElementById('staffInput').focus();
      showToast('กรุณากรอกชื่อผู้ตรวจเช็คก่อนบันทึก');
      return;
    }
    const values = {};
    app.querySelectorAll('.item-row').forEach(row=>{
      const id = row.dataset.item;
      const type = row.dataset.type;
      const obj = {};
      if(type==='number'){
        const v = row.querySelector('[data-field="val"]').value;
        obj.val = v;
      } else if(type==='text'){
        obj.val = row.querySelector('[data-field="val"]').value;
      } else if(type==='yesno' || type==='yesno_expiry'){
        const activeBtn = row.querySelector('[data-seg] button.active');
        obj.val = activeBtn ? (activeBtn.dataset.val==='true') : undefined;
        if(type==='yesno_expiry'){
          const d = row.querySelector('[data-field="expiry"]');
          if(d) obj.expiry = d.value;
        }
        const note = row.querySelector('[data-field="note"]');
        if(note) obj.note = note.value;
      }
      values[id] = obj;
    });

    saveLastStaffName(state.staffName.trim());
    const meta = {savedBy: state.staffName.trim(), savedAt: new Date().toISOString()};

    const rows = [];
    pos.items.forEach(it=>{
      if(it.type==='section') return;
      const v = values[it.id] || {};
      let value='', note='', expiry='';
      if(it.type==='number'){ value = v.val!==undefined ? v.val : ''; }
      else if(it.type==='text'){ value = v.val || ''; }
      else if(it.type==='yesno'){
        value = v.val===true ? it.trueLabel : (v.val===false ? it.falseLabel : '');
        note = v.note || '';
      } else if(it.type==='yesno_expiry'){
        value = v.val===true ? it.trueLabel : (v.val===false ? it.falseLabel : '');
        expiry = v.expiry || '';
      }
      rows.push({label: it.label, value, note, expiry});
    });

    showToast('กำลังบันทึกเข้า Google Sheet…');
    const saveBtn = document.getElementById('saveBtn');
    const originalLabel = saveBtn.innerHTML;
    saveBtn.disabled = true;
    saveBtn.innerHTML = '<span class="spinner on-dark"></span> กำลังบันทึก…';

    const res = await setEntry(state.date, state.shift, pos.id, `P${posIdx} ${pos.name}`, values, meta, rows);
    showToast(res.ok ? 'บันทึกเข้า Sheet เรียบร้อย' : 'บันทึกไม่สำเร็จ กรุณาตรวจสอบการเชื่อมต่อ');
    if(res.ok){
      setTimeout(renderDashboard, 500);
    } else {
      saveBtn.disabled = false;
      saveBtn.innerHTML = originalLabel;
    }
  });
}

function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

/* ============ Top controls ============ */
const dateInput = document.getElementById('dateInput');
const shiftInput = document.getElementById('shiftInput');
dateInput.value = state.date;
shiftInput.value = state.shift;
dateInput.addEventListener('change', ()=>{ state.date = dateInput.value; renderDashboard(); });
shiftInput.addEventListener('change', ()=>{ state.shift = shiftInput.value; renderDashboard(); });

document.getElementById('settingsBtn').addEventListener('click', openSettingsModal);
document.getElementById('settingsCancel').addEventListener('click', closeSettingsModal);
document.getElementById('settingsModal').addEventListener('click', (e)=>{
  if(e.target.id === 'settingsModal') closeSettingsModal();
});
document.getElementById('settingsSave').addEventListener('click', ()=>{
  const url = document.getElementById('sheetUrlInput').value.trim();
  state.apiUrl = url;
  saveApiUrl(url);
  updateSheetStatusDot();
  closeSettingsModal();
  showToast(url ? 'เชื่อมต่อ Google Sheet แล้ว' : 'ยังไม่ได้เชื่อมต่อ Google Sheet');
  renderDashboard();
});
document.getElementById('settingsClear').addEventListener('click', ()=>{
  state.apiUrl = '';
  clearApiUrl();
  updateSheetStatusDot();
  closeSettingsModal();
  showToast('เลิกเชื่อมต่อ Google Sheet แล้ว');
  renderDashboard();
});

/* ============ Init ============ */
state.apiUrl = loadApiUrl();
updateSheetStatusDot();
renderDashboard();
if(!state.apiUrl){
  openSettingsModal();
}
</script>
</body>
</html>
